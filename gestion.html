<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord - MiadMarket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #F97924; /* Couleur principale de MiadMarket */
            --primary-hover-color: #E86A14;
            --surface-color: #FFFFFF;
            --background-color: #F8F9FA;
            --text-color-primary: #212529;
            --text-color-secondary: #6C757D;
            --border-color: #DEE2E6;
            --font-family: 'Inter', sans-serif;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }
        body {
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--text-color-primary);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .main-container {
            width: 100%;
            max-width: 1400px;
            margin: 1.5rem;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            margin-bottom: 1.5rem;
        }
        header .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        header img {
            height: 40px;
        }
        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
            color: var(--text-color-primary);
        }
        #user-info {
            font-weight: 500;
        }
        #logout-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }
        #logout-btn:hover {
            text-decoration: underline;
        }
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .tab-btn {
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
            background-color: #E9ECEF;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-color-secondary);
            transition: all 0.2s ease-in-out;
        }
        .tab-btn.active {
            background-color: var(--surface-color);
            color: var(--primary-color);
            border-color: var(--border-color);
            border-bottom: 1px solid var(--surface-color);
            transform: translateY(1px);
        }
        .tab-content {
            display: none;
            background: var(--surface-color);
            padding: 2rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }
        .tab-content.active {
            display: block;
        }
        h2 {
            margin: 0 0 1.5rem 0;
            font-weight: 600;
            font-size: 1.5rem;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .form-group { display: flex; flex-direction: column; }
        label {
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text-color-secondary);
        }
        input, select, button, textarea {
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            font-size: 1rem;
            font-family: var(--font-family);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(249, 121, 36, 0.25);
        }
        button[type="submit"] {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            padding: 0.85rem 1.5rem;
            width: fit-content;
        }
        button[type="submit"]:hover { background-color: var(--primary-hover-color); }
        .table-wrapper { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
        }
        th, td {
            padding: 0.85rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            font-size: 0.9rem;
        }
        th {
            background-color: #F8F9FA;
            font-weight: 600;
            color: var(--text-color-secondary);
            text-transform: uppercase;
            font-size: 0.75rem;
        }
        td img {
            height: 40px;
            width: 40px;
            object-fit: cover;
            border-radius: 4px;
        }
        td a { color: var(--primary-color); text-decoration: none; font-weight: 500; }
        td a:hover { text-decoration: underline; }
        .loader {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 9999;
            justify-content: center; align-items: center;
        }
        .loader.active { display: flex; }
        .loader-spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden { display: none !important; }
        @media (max-width: 768px) {
            body { padding: 0; }
            .main-container { margin: 0; }
            header { flex-direction: column; gap: 1rem; border-radius: 0; }
            .tabs { padding: 0 1rem; }
            .tab-content { padding: 1.5rem; border-radius: 0; border-left:0; border-right:0; }
        }
    </style>
</head>
<body>

    <div id="main-container" class="main-container">
        <header>
            <div class="logo-container">
                <img src="https://miadmarket.com/wp-content/uploads/2023/10/logo-miad-market.png" alt="Logo MiadMarket">
                <h1>Tableau de Bord</h1>
            </div>
            <div>
                <span id="user-info"></span>
                <button id="logout-btn">Déconnexion</button>
            </div>
        </header>

        <!-- Onglets de navigation -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="products">Produits</button>
            <button class="tab-btn" data-tab="vendors" id="vendors-tab">Vendeurs</button>
        </div>

        <!-- Contenu des onglets -->
        <div id="products-content" class="tab-content active">
            <section id="form-section">
                <h2>Ajouter un Produit</h2>
                <form id="productForm">
                     <div class="form-grid">
                        <div class="form-group" id="vendor-select-group">
                            <label for="vendorSelect">Vendeur</label>
                            <select id="vendorSelect" name="vendeurId" required></select>
                        </div>
                        <div class="form-group">
                            <label for="NomProduit">Nom du Produit</label>
                            <input type="text" id="NomProduit" name="nomProduit" required>
                        </div>
                        <div class="form-group">
                            <label for="SKU">SKU</label>
                            <input type="text" id="SKU" name="sku">
                        </div>
                        <div class="form-group">
                            <label for="Type">Type de Produit</label>
                            <select id="Type" name="type" required>
                                <option value="simple">Simple</option>
                                <option value="variable">Variable</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="Categories">Catégories (séparées par des virgules)</label>
                            <input type="text" id="Categories" name="categories" placeholder="Ex: T-shirt, Homme">
                        </div>
                        <div class="form-group">
                            <label for="Image">Image du produit</label>
                            <input type="file" id="Image" name="Image">
                        </div>
                    </div>

                    <div id="variable-fields" class="hidden form-grid" style="margin-top: 1.5rem;">
                        <div class="form-group">
                            <label for="Attributs">Attributs (format JSON)</label>
                            <textarea id="Attributs" name="attributs" rows="4" placeholder='[{"nom":"Couleur", "valeurs":"Bleu, Vert"},{"nom":"Taille", "valeurs":"S, M"}]'></textarea>
                        </div>
                        <div class="form-group">
                            <label for="Variations">Variations (format JSON)</label>
                            <textarea id="Variations" name="variations" rows="4" placeholder='[{"combinaison":{"Couleur":"Bleu","Taille":"S"}, "prix": 20, "sku_variation":"SKU-BL-S"}]'></textarea>
                        </div>
                    </div>
                    <br>
                    <button type="submit">Ajouter le Produit</button>
                </form>
            </section>
            
            <hr style="border: none; border-top: 1px solid var(--border-color); margin: 2.5rem 0;">

            <section class="display-section">
                <h2 id="product-list-title">Liste des Produits</h2>
                 <div class="table-wrapper">
                    <table id="productTable">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Nom Produit</th>
                                <th>SKU</th>
                                <th class="admin-only">Vendeur</th>
                                <th>Type</th>
                                <th>Catégories</th>
                                <th>Statut</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </div>

        <div id="vendors-content" class="tab-content">
            <h2>Liste des Vendeurs</h2>
            <div class="table-wrapper">
                <table id="vendorTable">
                    <thead>
                        <tr>
                            <th>Nom Vendeur</th>
                            <th>Pays</th>
                            <th>Créé Par</th>
                            <th>ID Vendeur</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="loader" id="loader"><div class="loader-spinner"></div></div>

    <script>
        // URL du script Google Apps. À remplacer par la vôtre.
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwJHyhRfUTYkCNWegCUPLKW-13IbZbzrRvpDTeOJNa_fK3X5TPojeBFRk3P_TrI-frq0g/exec";
        const LOADER = document.getElementById('loader');

        const appState = {
            token: null,
            user: null,
            products: [],
            vendors: []
        };
        
        // --- INITIALISATION ---
        document.addEventListener('DOMContentLoaded', () => {
            appState.token = sessionStorage.getItem('authToken');
            const userJson = sessionStorage.getItem('authUser');

            if (!appState.token || !userJson) {
                alert("Accès non autorisé. Veuillez vous connecter.");
                window.location.href = 'index.html'; // Rediriger vers la page de connexion
                return;
            }

            try {
                appState.user = JSON.parse(userJson);
                initializeAppUI();
            } catch (e) {
                handleAuthError("Erreur de session. Veuillez vous reconnecter.");
            }
        });

        function initializeAppUI() {
            // Afficher les infos utilisateur et configurer la déconnexion
            document.getElementById('user-info').textContent = `Connecté en tant que: ${appState.user.email} (${appState.user.role})`;
            document.getElementById('logout-btn').addEventListener('click', () => {
                sessionStorage.clear();
                window.location.href = 'index.html';
            });
            
            // Configurer les onglets
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tab = btn.getAttribute('data-tab');
                    document.querySelectorAll('.tab-btn, .tab-content').forEach(el => el.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(tab + '-content').classList.add('active');
                });
            });

            // Listeners pour le formulaire
            document.getElementById('productForm').addEventListener('submit', handleFormSubmit);
            document.getElementById('Type').addEventListener('change', (e) => {
                document.getElementById('variable-fields').classList.toggle('hidden', e.target.value !== 'variable');
            });

            // Ajuster l'UI en fonction du rôle
            adjustUIForRole();
            
            // Charger les données initiales
            loadDashboardData();
        }
        
        function adjustUIForRole() {
            const isAdmin = appState.user.role === 'Administrateur' || appState.user.role === 'Informaticien';
            
            if (isAdmin) {
                // L'admin voit tout
                document.getElementById('vendors-tab').classList.remove('hidden');
                document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
            } else { // C'est un vendeur ('Représentant')
                // Cacher les éléments réservés à l'admin
                document.getElementById('vendors-tab').classList.add('hidden');
                document.getElementById('vendor-select-group').classList.add('hidden');
                document.querySelectorAll('.admin-only').forEach(el => el.classList.add('hidden'));
                document.getElementById('product-list-title').textContent = "Mes Produits";
            }
        }
        
        // --- API & GESTION DES DONNÉES ---
        async function postToApi(action, payload = {}) {
            showLoader(true);
            try {
                const request = { action, payload, token: appState.token };
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(request),
                    mode: 'cors',
                    headers: { 'Content-Type': 'application/json' }
                });

                const result = await response.json();

                if (result.status === 'error') {
                    if (result.message.includes("Token invalide")) {
                        handleAuthError(result.message);
                    }
                    throw new Error(result.message);
                }
                return result;
            } catch (error) {
                console.error(`Erreur API [${action}]:`, error);
                alert(`Erreur: ${error.message}`);
                throw error;
            } finally {
                showLoader(false);
            }
        }

        async function loadDashboardData() {
            try {
                const data = await postToApi('getDashboardData');
                appState.vendors = data.vendors || [];
                appState.products = data.products || [];
                
                renderAll();
            } catch (error) {
                console.error("Impossible de charger les données du tableau de bord.", error);
            }
        }
        
        function renderAll() {
            const isAdmin = appState.user.role === 'Administrateur' || appState.user.role === 'Informaticien';
            if (isAdmin) {
                populateVendorSelect(appState.vendors);
                renderVendorTable(appState.vendors);
            }
            renderProductTable(appState.products);
        }

        // --- GESTION DES RENDUS (AFFICHAGE) ---
        function populateVendorSelect(vendors) {
            const vendorSelect = document.getElementById('vendorSelect');
            vendorSelect.innerHTML = '';
            vendors.forEach(vendor => {
                vendorSelect.add(new Option(`${vendor.NomVendeur} (${vendor.Pays})`, vendor.VendeurID));
            });
        }

        function renderVendorTable(vendors) {
            const tbody = document.getElementById('vendorTable').querySelector('tbody');
            tbody.innerHTML = '';
            if (vendors.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">Aucun vendeur à afficher.</td></tr>';
                return;
            }
            vendors.forEach(v => {
                const tr = tbody.insertRow();
                tr.innerHTML = `
                    <td>${v.NomVendeur || 'N/A'}</td>
                    <td>${v.Pays || 'N/A'}</td>
                    <td>${v.CrééParEmail || 'N/A'}</td>
                    <td>${v.VendeurID || 'N/A'}</td>
                `;
            });
        }

        function renderProductTable(products) {
            const tbody = document.getElementById('productTable').querySelector('tbody');
            tbody.innerHTML = '';
             if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7">Aucun produit à afficher.</td></tr>';
                return;
            }

            const vendorsMap = new Map(appState.vendors.map(v => [v.VendeurID, v.NomVendeur]));
            const isAdmin = appState.user.role === 'Administrateur' || appState.user.role === 'Informaticien';

            products.forEach(p => {
                const tr = tbody.insertRow();
                tr.innerHTML = `
                    <td><img src="${p.ImageURL || 'https://via.placeholder.com/150'}" alt="${p.NomProduit}"></td>
                    <td>${p.NomProduit}</td>
                    <td>${p.SKU || 'N/A'}</td>
                    <td class="admin-only">${vendorsMap.get(p.VendeurID) || 'N/A'}</td>
                    <td>${p.Type}</td>
                    <td>${p.Catégories || 'N/A'}</td>
                    <td>${p.StatutRécupération}</td>
                `;
            });
            
            // Ré-appliquer la visibilité après avoir injecté le HTML
            if(!isAdmin) {
                 document.querySelectorAll('.admin-only').forEach(el => el.classList.add('hidden'));
            }
        }

        // --- GESTION DES ÉVÉNEMENTS ---
        async function handleFormSubmit(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const fileInput = document.getElementById('Image');
            
            let payload = Object.fromEntries(formData.entries());

            // Si c'est un vendeur, son ID est pris depuis sa session
            if (appState.user.role === 'Représentant') {
                payload.vendeurId = appState.user.vendeurId;
            }

            // Gérer les champs JSON
            if (payload.type === 'variable') {
                try {
                    payload.attributs = payload.attributs ? JSON.parse(payload.attributs) : [];
                    payload.variations = payload.variations ? JSON.parse(payload.variations) : [];
                } catch(err) {
                    alert('Le format JSON pour les attributs ou variations est invalide.');
                    return;

                }
            }
            
            try {
                 // Gérer l'upload d'image
                if (fileInput.files.length > 0) {
                    payload.imageFile = await fileToBase64(fileInput.files[0]);
                }
                
                await postToApi('addProduct', payload);
                
                alert("Produit ajouté avec succès !");
                form.reset();
                document.getElementById('variable-fields').classList.add('hidden');
                loadDashboardData(); // Recharger les données pour voir le nouveau produit

            } catch (error) {
                // L'erreur est déjà affichée par postToApi
            }
        }
        
        // --- FONCTIONS UTILITAIRES ---
        function showLoader(show) {
            LOADER.classList.toggle('active', show);
        }

        function handleAuthError(message) {
            alert(message);
            sessionStorage.clear();
            window.location.href = 'index.html';
        }
        
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    const result = reader.result;
                    const base64 = result.substring(result.indexOf(',') + 1);
                    resolve({ base64: base64, type: file.type, name: file.name });
                };
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
