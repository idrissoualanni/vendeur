<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Vendeur - MiadMarket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .auth-card {
            width: 100%;
            max-width: 480px;
        }
        
        .auth-logo {
            height: 56px;
            margin-bottom: 1.5rem;
            transition: transform var(--transition-slow);
        }
        
        .auth-logo:hover {
            transform: scale(1.05);
        }
        
        .auth-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        
        .auth-subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        
        .auth-footer {
            text-align: center;
            padding-top: 1.5rem;
            margin-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .auth-footer a {
            font-weight: 600;
            color: var(--primary-color);
        }
        
        .auth-footer a:hover {
            text-decoration: underline;
        }
        
        .btn-submit {
            width: 100%;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    
    <div class="auth-page">
        <div class="auth-card card fade-in">
            <div class="card-body">
                <a href="index.html">
                    <img src="https://miadmarket.com/wp-content/uploads/2023/10/logo-miad-market.png" alt="Logo MiadMarket" class="auth-logo">
                </a>
                <h1 class="auth-title">Espace Vendeur</h1>
                <p class="auth-subtitle">Connectez-vous pour accéder à votre tableau de bord</p>
                
                <div id="errorMessage" class="alert alert-error" style="display: none;"></div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail" class="form-label">Email</label>
                        <input type="email" id="loginEmail" class="form-input" placeholder="votre@email.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="loginPassword" class="form-label">Mot de passe</label>
                        <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-submit">
                        Se connecter
                    </button>
                </form>
                
                <div class="auth-footer">
                    Pas encore de compte ? <a href="signup-vendeur.html">Inscrivez-vous</a>
                </div>
            </div>
        </div>
    </div>

    <div class="loader-overlay" id="loader">
        <div class="loader-spinner"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzMD7mJlo8YG4rNq6rEXvV17a5sUg2GDl7hUSjSsX6ktulHC11lOaXG-wL3IGLzYbLSbQ/exec";
        const LOADER = document.getElementById('loader');
        const ERROR_MESSAGE_DIV = document.getElementById('errorMessage');

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
        });

        async function postToApi(action, payload) {
            showLoader(true);
            ERROR_MESSAGE_DIV.style.display = 'none';
            try {
                const request = { action, payload, token: null };
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(request),
                    mode: 'cors',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();
                if (result.status === 'error') throw new Error(result.message);
                return result;
            } catch (error) {
                showError(error.message);
                throw error;
            } finally {
                showLoader(false);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const result = await postToApi('login', { email, password });
                
                if (result.user.role !== 'Représentant') {
                    showError("Accès refusé. Cet espace est réservé aux vendeurs.");
                    return;
                }

                sessionStorage.setItem('authToken', result.token);
                sessionStorage.setItem('authUser', JSON.stringify(result.user));

                window.location.href = 'page-vendeur.html';
            } catch (error) {
                // L'erreur est déjà affichée par postToApi
            }
        }

        function showLoader(show) {
            LOADER.classList.toggle('active', show);
        }

        function showError(message) {
            ERROR_MESSAGE_DIV.textContent = message;
            ERROR_MESSAGE_DIV.style.display = 'block';
        }
    </script>
</body>
</html>
