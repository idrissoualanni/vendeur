<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Vendeur - MiadMarket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .auth-card {
            width: 100%;
            max-width: 520px;
        }
        
        .auth-logo {
            height: 56px;
            margin-bottom: 1.5rem;
        }
        
        .auth-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        
        .auth-subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        
        .auth-footer {
            text-align: center;
            padding-top: 1.5rem;
            margin-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .auth-footer a {
            font-weight: 600;
            color: var(--primary-color);
        }
        
        .btn-submit {
            width: 100%;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    
    <div class="auth-page">
        <div class="auth-card card fade-in">
            <div class="card-body">
                <a href="index.html">
                    <img src="https://miadmarket.com/wp-content/uploads/2023/10/logo-miad-market.png" alt="Logo MiadMarket" class="auth-logo">
                </a>
                <h1 class="auth-title">Créer un Compte Vendeur</h1>
                <p class="auth-subtitle">Rejoignez MiadMarket et commencez à vendre</p>
                
                <div id="messageBox" class="alert" style="display: none;"></div>
                
                <form id="signupForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="signupNomVendeur" class="form-label">Nom du vendeur</label>
                            <input type="text" id="signupNomVendeur" class="form-input" placeholder="Votre boutique" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="signupPays" class="form-label">Pays</label>
                            <select id="signupPays" class="form-select" required></select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="signupEmail" class="form-label">Email</label>
                        <input type="email" id="signupEmail" class="form-input" placeholder="votre@email.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="signupPassword" class="form-label">Mot de passe</label>
                        <input type="password" id="signupPassword" class="form-input" placeholder="••••••••" required minlength="6">
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-submit">
                        Créer mon compte
                    </button>
                </form>
                
                <div class="auth-footer">
                    Déjà un compte ? <a href="login-vendeur.html">Connectez-vous</a>
                </div>
            </div>
        </div>
    </div>

    <div class="loader-overlay" id="loader">
        <div class="loader-spinner"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzMD7mJlo8YG4rNq6rEXvV17a5sUg2GDl7hUSjSsX6ktulHC11lOaXG-wL3IGLzYbLSbQ/exec";
        const LOADER = document.getElementById('loader');
        const MESSAGE_BOX = document.getElementById('messageBox');
        
        const africanCountries = ["Algérie", "Angola", "Bénin", "Botswana", "Burkina Faso", "Burundi", "Cabo Verde", "Cameroun", "République centrafricaine", "Tchad", "Comores", "Congo (Congo-Brazzaville)", "Côte d'Ivoire", "Djibouti", "Égypte", "Guinée équatoriale", "Érythrée", "Eswatini", "Éthiopie", "Gabon", "Gambie", "Ghana", "Guinée", "Guinée-Bissau", "Kenya", "Lesotho", "Liberia", "Libye", "Madagascar", "Malawi", "Mali", "Mauritanie", "Maurice", "Maroc", "Mozambique", "Namibie", "Niger", "Nigeria", "République Démocratique du Congo", "Rwanda", "Sao Tomé-et-Principe", "Sénégal", "Seychelles", "Sierra Leone", "Somalie", "Afrique du Sud", "Soudan du Sud", "Soudan", "Tanzanie", "Togo", "Tunisie", "Ouganda", "Zambie", "Zimbabwe"];

        document.addEventListener('DOMContentLoaded', () => {
            const selectPays = document.getElementById('signupPays');
            africanCountries.forEach(country => {
                selectPays.add(new Option(country, country));
            });
            document.getElementById('signupForm').addEventListener('submit', handleSignup);
        });

        async function postToApi(action, payload) {
            showLoader(true);
            hideMessage();
            try {
                const request = { action, payload, token: null };
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(request),
                    mode: 'cors',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();
                if (result.status === 'error') throw new Error(result.message);
                return result;
            } catch (error) {
                showMessage(error.message, 'error');
                throw error;
            } finally {
                showLoader(false);
            }
        }
        
        async function handleSignup(e) {
            e.preventDefault();
            const payload = {
                nomVendeur: document.getElementById('signupNomVendeur').value,
                pays: document.getElementById('signupPays').value,
                email: document.getElementById('signupEmail').value,
                password: document.getElementById('signupPassword').value,
            };

            try {
                const result = await postToApi('registerRepresentative', payload);
                document.getElementById('signupForm').style.display = 'none';
                showMessage(result.message + " Vous pouvez maintenant vous connecter.", 'success');
            } catch (error) {
                // L'erreur est déjà gérée par postToApi
            }
        }

        function showLoader(show) {
            LOADER.classList.toggle('active', show);
        }

        function showMessage(message, type = 'error') {
            MESSAGE_BOX.textContent = message;
            MESSAGE_BOX.className = `alert alert-${type}`;
            MESSAGE_BOX.style.display = 'block';
        }

        function hideMessage() {
            MESSAGE_BOX.style.display = 'none';
        }
    </script>
</body>
</html>
