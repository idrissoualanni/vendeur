<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gestion Vendeurs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #F97316;
            --primary-hover-color: #EA580C;
            --secondary-color: #F3F4F6;
            --surface-color: #FFFFFF;
            --text-color-primary: #1F2937;
            --text-color-secondary: #6B7280;
            --border-color: #E5E7EB;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --border-radius: 8px;
            --box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
        }
        body {
            font-family: var(--font-family);
            background-color: var(--secondary-color);
            margin: 0;
            padding: 2.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            background: var(--surface-color);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        header, .form-section {
            padding: 2rem;
        }
        header {
            background: var(--surface-color);
            color: var(--text-color-primary);
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }
        h1 { margin: 0; font-weight: 600; font-size: 1.75rem; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 1.5rem; }
        label { margin-bottom: 0.5rem; font-weight: 500; font-size: 0.875rem; color: var(--text-color-secondary); }
        input, button {
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            font-size: 1rem;
            font-family: var(--font-family);
        }
        input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.3); }
        button { background-color: var(--primary-color); color: white; border: none; cursor: pointer; font-weight: 600; width: 100%; }
        button:hover { background-color: var(--primary-hover-color); }
        .hidden { display: none; }
        .loader {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8); z-index: 9999;
            justify-content: center; align-items: center;
        }
        .loader.active { display: flex; }
        .loader-spinner {
            border: 5px solid #f3f3f3; border-top: 5px solid var(--primary-color);
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-container">
        <header>
            <h1>Connexion</h1>
        </header>
        <section class="form-section">
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit">Connexion</button>
                <p id="login-error" class="hidden" style="color: red; margin-top: 1rem;"></p>
            </form>
        </section>
    </div>

    <div class="loader" id="loader">
        <div class="loader-spinner"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_2DvE-Cu3_WIQRC5LCu7SQ06jKstggFhnJE9f9JXQp-IFyrFlkaioGs0h6Kc0KH0KDQ/exec";
        const LOADER = document.getElementById('loader');

        document.addEventListener('DOMContentLoaded', () => {
            if (SCRIPT_URL.includes("VOTRE_URL")) {
                alert("N'oubliez pas de configurer l'URL de l'API dans le script.");
            }
            if (sessionStorage.getItem('authToken')) {
                window.location.href = 'gestion.html';
            }
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
        });

        async function postToApi(action, payload, token = null) {
            showLoader(true);
            try {
                const request = { action, payload, token };
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(request),
                    mode: 'cors'
                });

                if (!response.ok) throw new Error(`Erreur réseau: ${response.statusText}`);
                
                const resultText = await response.text();
                try {
                    const result = JSON.parse(resultText);
                    if (result.status === 'error') throw new Error(result.message);
                    return result;
                } catch (parseError) {
                    console.error("Could not parse JSON response:", resultText);
                    throw new Error("Réponse inattendue du serveur.");
                }
            } finally {
                showLoader(false);
            }
        }
        
        async function handleLogin(e) {
            e.preventDefault();
            const form = e.target;
            const email = form.email.value;
            const password = form.password.value;
            const errorEl = document.getElementById('login-error');
            errorEl.textContent = '';
            errorEl.classList.add('hidden');

            try {
                const result = await postToApi('login', { email, password });
                sessionStorage.setItem('authToken', result.token);
                sessionStorage.setItem('authUser', JSON.stringify(result.user));
                window.location.href = 'gestion.html';
            } catch (error) {
                console.error("Erreur de connexion:", error);
                errorEl.textContent = error.message;
                errorEl.classList.remove('hidden');
            }
        }

        function showLoader(show) {
            LOADER.classList.toggle('active', show);
        }
    </script>
</body>
</html>
