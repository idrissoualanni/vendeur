<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue - Espace Partenaire MiadMarket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #F97924;
            --primary-hover-color: #E86A14;
            --surface-color: #FFFFFF;
            --background-color: #F8F9FA;
            --text-color-primary: #212529;
            --text-color-secondary: #6C757D;
            --border-color: #DEE2E6;
            --font-family: 'Inter', sans-serif;
            --border-radius: 12px;
            --box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.1);
        }
        body {
            font-family: var(--font-family);
            background-color: var(--background-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .landing-container {
            text-align: center;
            background: var(--surface-color);
            padding: 4rem 3rem;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            border: 1px solid var(--border-color);
            max-width: 600px;
            width: 100%;
        }
        .landing-container img {
            height: 60px;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-color-primary);
            margin: 0 0 1rem 0;
        }
        p {
            font-size: 1.1rem;
            color: var(--text-color-secondary);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        .button-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
        }
        .btn {
            display: block;
            padding: 1rem 1.5rem;
            border-radius: var(--border-radius);
            border: 2px solid transparent;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn-secondary {
            background-color: transparent;
            color: var(--primary-color);
            border-color: var(--primary-color);
        }
        .btn-secondary:hover {
            background-color: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        @media (min-width: 576px) {
            .button-group {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <img src="https://miadmarket.com/wp-content/uploads/2023/10/logo-miad-market.png" alt="Logo MiadMarket">
        <h1>Espace Partenaire</h1>
        <p>Bienvenue sur le portail de gestion de MiadMarket. Connectez-vous pour gérer vos produits ou administrer la plateforme.</p>
        <div class="button-group">
            <a href="login-vendeur.html" class="btn btn-primary">Espace Vendeur</a>
            <a href="login-admin.html" class="btn btn-secondary">Espace Admin</a>
        </div>
    </div>

</body>
</html>
