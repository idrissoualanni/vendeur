<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue - Espace Partenaire MiadMarket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .landing-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .landing-card {
            text-align: center;
            max-width: 640px;
            width: 100%;
        }
        
        .landing-logo {
            height: 72px;
            margin-bottom: 2rem;
            transition: transform var(--transition-slow);
        }
        
        .landing-logo:hover {
            transform: scale(1.05);
        }
        
        .landing-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary-600) 0%, var(--primary-500) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .landing-subtitle {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            line-height: 1.8;
        }
        
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }
        
        .btn-landing {
            padding: 1.25rem 2rem;
            font-size: 1.05rem;
            position: relative;
            overflow: hidden;
        }
        
        .btn-landing::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn-landing:hover::before {
            left: 100%;
        }
        
        @media (max-width: 640px) {
            .landing-page {
                padding: 1rem;
            }
            
            .landing-title {
                font-size: 2rem;
            }
            
            .button-group {
                grid-template-columns: 1fr;
            }
            
            .landing-logo {
                height: 56px;
            }
        }
    </style>
</head>
<body>
    
    <div class="landing-page">
        <div class="landing-card card fade-in">
            <div class="card-body">
                <img src="https://miadmarket.com/wp-content/uploads/2023/10/logo-miad-market.png" alt="Logo MiadMarket" class="landing-logo">
                <h1 class="landing-title">Espace Partenaire</h1>
                <p class="landing-subtitle">
                    Bienvenue sur le portail de gestion de MiadMarket.<br>
                    Connectez-vous pour gérer vos produits ou administrer la plateforme.
                </p>
                <div class="button-group">
                    <a href="login-vendeur.html" class="btn btn-primary btn-landing">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        Vendeur
                    </a>
                    <a href="login-admin.html" class="btn btn-secondary btn-landing">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        Espace Admin
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
